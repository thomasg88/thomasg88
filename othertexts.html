<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Άλλα Κείμενα</title>
    <link rel="stylesheet" href="styles.css">
    <script src="translate.js"></script>
</head>
<body>

<header>
    <h1>Άλλα Κείμενα</h1>
    <nav>
        <a href="index.html" class="back-button">🏠 Επιστροφή στην Αρχική</a>
    </nav>
</header>

<main>
    <section class="section">
        <div class="container">
            <h2>📝 Άλλα Κείμενα</h2>
            <p>Παρακάτω μπορείτε να δείτε κείμενα που δεν ανήκουν στις κλασικές κατηγορίες δημοσιεύσεων.</p>

            <div id="other-texts-container" class="grid">
                <p>📡 Φόρτωση δεδομένων...</p>
            </div>

        </div>
    </section>
</main>

<footer>
    <p>&copy; 2025 Θωμάς Γκουντόπουλος. Όλα τα δικαιώματα κατοχυρωμένα.</p>
</footer>

<script>
    const API_KEY = "AIzaSyD6TQIsLSgSQ6-YNCyEkV56Bl5_G-jYMzI"; // Το δικό σου API KEY
    const FOLDER_ID = "1c5caBxWrakoLjLRnKYiii-Wyvtb9a6c0"; // ID του φακέλου "Άλλα Κείμενα"

    async function fetchOtherTexts() {
        const url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents&key=${API_KEY}&fields=files(id, name, mimeType, webViewLink)`;

        try {
            const response = await fetch(url);
            const data = await response.json();
            displayOtherTexts(data.files);
        } catch (error) {
            console.error("Σφάλμα φόρτωσης αρχείων:", error);
            document.getElementById("other-texts-container").innerHTML = "<p>❌ Δεν βρέθηκαν κείμενα.</p>";
        }
    }

    function displayOtherTexts(files) {
        const container = document.getElementById("other-texts-container");
        container.innerHTML = "";

        files.forEach(file => {
            const fileElement = document.createElement("div");
            fileElement.classList.add("card");

            fileElement.innerHTML = `
                <h4>${file.name}</h4>
                <iframe src="https://drive.google.com/file/d/${file.id}/preview" width="100%" height="300" frameborder="0" allowfullscreen></iframe>
                <div style="margin-top:10px;">
                    <a href="https://drive.google.com/uc?id=${file.id}&export=download" class="download-button" target="_blank">📥 Κατέβασμα</a>
                    <a href="${file.webViewLink}" class="view-button" target="_blank" style="margin-left:10px;">📂 Προβολή στο Drive</a>
                </div>
            `;

            container.appendChild(fileElement);
        });
    }

    fetchOtherTexts();
</script>

</body>
</html>
